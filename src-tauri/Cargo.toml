[package]
name = "yuzu-browser"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yuzu_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rfd = "0.15"
ureq = { version = "2", features = ["tls"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
filetime = "0.2"
lofty = "0.22"
tar = "0.4"
flate2 = "1"
bzip2-rs = "0.1"
lzma-rs = "0.3"
ruzstd = "0.7"
sevenz-rust2 = "0.16"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
cab = "0.6"
ar = "0.9"
lopdf = "0.34"
pelite = { version = "0.10", default-features = false, features = ["std"] }
sha2 = "0.10"
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com"] }

