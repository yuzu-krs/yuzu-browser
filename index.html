<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yuzu-browser</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <nav class="tabbar">
      <div id="tabs" class="tabs"></div>
      <button id="new-tab" class="new-tab-btn" type="button" title="新しいタブ">
        ＋
      </button>
    </nav>
    <header class="toolbar">
      <button id="back" class="nav-btn" type="button" title="戻る">←</button>
      <button id="forward" class="nav-btn" type="button" title="進む">→</button>
      <button id="reload" class="nav-btn" type="button" title="再読み込み">
        ⟳
      </button>
      <form id="address-form" class="address-form">
        <input
          id="address"
          class="address-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="URLを入力 または DuckDuckGo で検索"
        />
      </form>
      <div class="zoom-control" title="ズーム (Ctrl+ホイール / Ctrl+0 で 100%)">
        <button id="zoom-out" class="nav-btn zoom-btn" type="button">−</button>
        <span id="zoom-display" class="zoom-display">100%</span>
        <button id="zoom-in" class="nav-btn zoom-btn" type="button">＋</button>
      </div>
    </header>
    <nav id="bookmarks-bar" class="bookmarks-bar" aria-label="ブックマークバー">
      <div id="bookmarks-bar-items" class="bookmarks-bar-items"></div>
      <div id="bookmarks-bar-empty" class="bookmarks-bar-empty" hidden>
        ☆ボタンでブックマークを追加できます
      </div>
      <button
        id="bookmarks-bar-add"
        class="bookmarks-bar-add"
        type="button"
        title="このページをブックマーク (Ctrl+D)"
      >
        ☆
      </button>
      <button
        id="bookmarks-open"
        class="bookmarks-bar-add bookmarks-open-btn"
        type="button"
        title="ブックマーク一覧 (Ctrl+B)"
      >
        ▤
      </button>
      <button
        id="toolbox-open"
        class="bookmarks-bar-add toolbox-open-btn"
        type="button"
        title="ツールボックス"
      >
        🧰
      </button>
    </nav>
    <div id="bookmarks-panel" class="bookmarks-panel" hidden>
      <div class="bookmarks-header">
        <span>ブックマーク</span>
        <button
          id="bookmarks-close"
          class="bookmarks-close"
          type="button"
          title="閉じる"
        >
          ×
        </button>
      </div>
      <ul id="bookmarks-list" class="bookmarks-list"></ul>
      <div id="bookmarks-empty" class="bookmarks-empty" hidden>
        まだブックマークはありません。☆ボタンで追加できます。
      </div>
    </div>
    <div id="toolbox-panel" class="bookmarks-panel toolbox-panel" hidden>
      <div class="bookmarks-header">
        <span>🧰 ツールボックス</span>
        <button
          id="toolbox-close"
          class="bookmarks-close"
          type="button"
          title="閉じる"
        >
          ×
        </button>
      </div>
      <div class="toolbox-body">
        <section class="toolbox-tool">
          <h3>YouTube ダウンロード</h3>
          <div class="toolbox-row">
            <label for="ytdlp-url">URL</label>
            <input
              id="ytdlp-url"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="https://www.youtube.com/watch?v=..."
            />
            <button
              id="ytdlp-fill-current"
              type="button"
              title="現在のタブ URL を入れる"
            >
              現在のタブ
            </button>
          </div>
          <div class="toolbox-row">
            <label>形式</label>
            <select id="ytdlp-mode">
              <option value="video">動画 (mp4)</option>
              <option value="audio">音声のみ (mp3)</option>
            </select>
            <span id="ytdlp-quality-wrap">
              <label for="ytdlp-quality">画質</label>
              <select id="ytdlp-quality">
                <option value="best">最高</option>
                <option value="1080">1080p まで</option>
                <option value="720">720p まで</option>
                <option value="480">480p まで</option>
              </select>
            </span>
          </div>
          <div class="toolbox-row">
            <label for="ytdlp-dir">保存先</label>
            <input id="ytdlp-dir" type="text" spellcheck="false" />
            <button id="ytdlp-pick-dir" type="button">参照…</button>
          </div>
          <div class="toolbox-row toolbox-actions">
            <button id="ytdlp-run" class="toolbox-primary" type="button">
              ダウンロード開始
            </button>
            <button id="ytdlp-cancel" type="button" disabled>キャンセル</button>
            <span id="ytdlp-status" class="toolbox-status"></span>
          </div>
          <pre id="ytdlp-log" class="toolbox-log"></pre>
        </section>

        <section class="toolbox-tool">
          <h3>ファイル形式コンバータ</h3>
          <div class="toolbox-row">
            <label for="conv-input">入力</label>
            <input id="conv-input" type="text" spellcheck="false" placeholder="変換元ファイル (画像 / 動画 / 音声)" />
            <button id="conv-pick-input" type="button">参照…</button>
          </div>
          <div class="toolbox-row">
            <label for="conv-format">出力形式</label>
            <select id="conv-format">
              <optgroup label="画像">
                <option value="png">PNG (.png)</option>
                <option value="jpg">JPEG (.jpg)</option>
                <option value="webp">WebP (.webp)</option>
                <option value="gif">GIF (.gif)</option>
                <option value="bmp">BMP (.bmp)</option>
                <option value="tiff">TIFF (.tiff)</option>
                <option value="ico">ICO (.ico)</option>
                <option value="avif">AVIF (.avif)</option>
              </optgroup>
              <optgroup label="動画">
                <option value="mp4">MP4 (.mp4)</option>
                <option value="webm">WebM (.webm)</option>
                <option value="mkv">Matroska (.mkv)</option>
                <option value="mov">QuickTime (.mov)</option>
                <option value="avi">AVI (.avi)</option>
                <option value="gif-anim">アニメーション GIF (.gif)</option>
              </optgroup>
              <optgroup label="音声">
                <option value="mp3">MP3 (.mp3)</option>
                <option value="wav">WAV (.wav)</option>
                <option value="ogg">Ogg Vorbis (.ogg)</option>
                <option value="m4a">AAC / M4A (.m4a)</option>
                <option value="flac">FLAC (.flac)</option>
                <option value="opus">Opus (.opus)</option>
              </optgroup>
            </select>
          </div>
          <div class="toolbox-row">
            <label for="conv-out">出力先</label>
            <input id="conv-out" type="text" spellcheck="false" placeholder="(空なら入力と同じフォルダ)" />
            <button id="conv-pick-out" type="button">参照…</button>
          </div>
          <div class="toolbox-row toolbox-actions">
            <button id="conv-run" class="toolbox-primary" type="button">変換開始</button>
            <button id="conv-cancel" type="button" disabled>キャンセル</button>
            <span id="conv-status" class="toolbox-status"></span>
          </div>
          <pre id="conv-log" class="toolbox-log"></pre>
        </section>
      </div>
    </div>
  </body>
</html>
